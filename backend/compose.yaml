services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: {}